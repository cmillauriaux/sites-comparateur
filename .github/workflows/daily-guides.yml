name: Daily Pillar Guide Generation

# Drains pending pillar pages (intent='guide') auto-enqueued by daily-articles
# after each comparatif cluster ships. One pillar per (niche, market) per day
# while stock is available — once the queue empties (no recent comparatif),
# the run is a silent no-op.
#
# Off-affiliate balance lever: target ~30% off-aff content vs affiliate.
# daily-articles publishes 1-2 affiliate/day; this run + weekly-informational
# bring the off-aff side to ~3-5/week per site.

on:
  # 4 cron slots spread across the day, each ~1h after the corresponding
  # daily-articles slot to let it enqueue today's pillars first. Only one
  # slot per (site, day) is honoured by cadence-cli; the other 3 cost only
  # ~30s of CI checkout + gate.
  schedule:
    - cron: '19 7 * * *'    # slot 0 — ~07:19 UTC (after daily-articles 06:11)
    - cron: '43 11 * * *'   # slot 1 — ~11:43 UTC (after daily-articles 10:37)
    - cron: '31 15 * * *'   # slot 2 — ~15:31 UTC (after daily-articles 14:23)
    - cron: '53 19 * * *'   # slot 3 — ~19:53 UTC (after daily-articles 18:47)
  workflow_dispatch:
    inputs:
      site:
        description: 'siteId (<niche>-<market>) to run, or "all"'
        required: false
        default: all
      force_slot:
        description: 'Force a specific slot for testing (0-3, leave empty for auto)'
        required: false
        default: ''

permissions:
  contents: write     # commit data/ updates back to main

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # serialize writes to data/semrush-priorities.json
      # Mirror packages/config/niches.js#ENABLED_SITES — keep in sync with
      # daily-articles.yml.
      matrix:
        include:
          - { niche: jardin-bricolage, market: fr }
          - { niche: jardin-bricolage, market: us }
          - { niche: jardin-bricolage, market: gb }
    env:
      NICHE:  ${{ matrix.niche }}
      MARKET: ${{ matrix.market }}
      SITE:   ${{ matrix.niche }}-${{ matrix.market }}
      MANUAL_SITE: ${{ github.event.inputs.site }}
      TRIGGER_CRON: ${{ github.event.schedule }}
      FORCE_SLOT: ${{ github.event.inputs.force_slot }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Filter by manual input
        run: |
          if [ -n "$MANUAL_SITE" ] && [ "$MANUAL_SITE" != "all" ] && [ "$MANUAL_SITE" != "$SITE" ]; then
            echo "Skipping $SITE (manual run targets $MANUAL_SITE)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != '1'
        name: Resolve slot from cron schedule
        run: |
          case "$TRIGGER_CRON" in
            '19 7 * * *')  SLOT=0 ;;
            '43 11 * * *') SLOT=1 ;;
            '31 15 * * *') SLOT=2 ;;
            '53 19 * * *') SLOT=3 ;;
            *)             SLOT="${FORCE_SLOT:-0}" ;;
          esac
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - if: env.SKIP != '1'
        uses: pnpm/action-setup@v4

      - if: env.SKIP != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: env.SKIP != '1'
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cadence gate: anti-Google-detection ramp + per-day slot election.
      # Runs after dep install (needs the workspace config) but before the
      # heavy Claude generation step — rejected slots short-circuit early.
      - if: env.SKIP != '1'
        name: Cadence gate
        run: |
          DECISION=$(node packages/scripts/cadence-cli.js \
            --niche "$NICHE" --market "$MARKET" \
            --workflow daily-guides --slot "$SLOT" --num-slots 4)
          if [ "$DECISION" = "skip" ]; then
            echo "Cadence gate: skip for $SITE (slot=$SLOT)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != '1'
        name: Check pending pillar stock
        run: |
          PILLAR_LEN=$(node -e "const p=require('./data/semrush-priorities.json'); console.log((p[process.env.NICHE]?.[process.env.MARKET]||[]).filter(o=>o.intent==='guide'&&o.status==='pending').length)")
          echo "pending pillars for $SITE: $PILLAR_LEN"
          if [ "$PILLAR_LEN" = "0" ]; then
            echo "No pending pillar — skipping the rest of the run (this is normal until a comparatif cluster ships)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != '1'
        name: Install Playwright Chromium (for scraper browser fallback)
        run: pnpm --filter ./packages/scripts exec playwright install --with-deps chromium

      - if: env.SKIP != '1'
        name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - if: env.SKIP != '1'
        name: Generate pillar (--cluster --guide-only --count 1)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Hero image fetch (free image sources) — guides still get a topical hero.
          PEXELS_API_KEY:          ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:         ${{ secrets.PIXABAY_API_KEY }}
          # No Amazon / Awin secrets needed — pillar pages are off-affiliate
          # and the validator blocks any leaked CTA. Image fetch is skipped
          # because guide intent has no product components.
        run: node packages/scripts/article-generator.js --niche "$NICHE" --market "$MARKET" --cluster --guide-only --count 1

      - if: env.SKIP != '1'
        name: Build site
        run: pnpm --filter "./sites/$NICHE/$MARKET" build

      - if: env.SKIP != '1'
        name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/${{ matrix.niche }}/${{ matrix.market }}/dist --project-name=${{ matrix.niche }}-${{ matrix.market }} --branch=main

      - if: env.SKIP != '1'
        name: Commit data/ updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ "sites/$NICHE/$MARKET/src/content/articles/"
          git diff --staged --quiet || git commit -m "content: daily $SITE pillar guide"

      - if: env.SKIP != '1'
        name: Safe push (rebase + retry)
        uses: ./.github/actions/safe-push
