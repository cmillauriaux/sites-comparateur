name: Build Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { niche: jardin-bricolage, market: fr }
          - { niche: jardin-bricolage, market: us }
          - { niche: jardin-bricolage, market: gb }
          - { niche: cuisine,          market: fr }
          - { niche: solaire,          market: fr }
          - { niche: veto,             market: fr }
    env:
      NICHE:  ${{ matrix.niche }}
      MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./sites/$NICHE/$MARKET" build
