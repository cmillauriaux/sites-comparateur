name: Daily Article Generation

on:
  # 4 cron slots spread across the day. Each site gets ONE slot honoured per
  # day (elected by cadence-cli below), the other 3 trigger a cheap early-exit
  # (~30s of CI for checkout + gate). This breaks the "robot publishing at
  # 07:00 UTC sharp" pattern without burning minutes on a sleep.
  schedule:
    - cron: '11 6 * * *'    # slot 0 — ~06:11 UTC
    - cron: '37 10 * * *'   # slot 1 — ~10:37 UTC
    - cron: '23 14 * * *'   # slot 2 — ~14:23 UTC
    - cron: '47 18 * * *'   # slot 3 — ~18:47 UTC
  workflow_dispatch:
    inputs:
      site:
        description: 'siteId (<niche>-<market>) to run, or "all"'
        required: false
        default: all
      force_slot:
        description: 'Force a specific slot for testing (0-3, leave empty for auto)'
        required: false
        default: ''
      bypass_cadence:
        description: 'Bypass cadence gate (manual test runs only — ignores activeToday + slot election)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write     # commit data/ updates back to main

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # serialize writes to data/keywords-queue.json
      # Mirror packages/config/niches.js#ENABLED_SITES. Add a row here only
      # when the matching sites/<niche>/<market>/ exists AND its env vars +
      # Cloudflare Pages project + custom domain are wired up.
      matrix:
        include:
          - { niche: jardin-bricolage, market: fr }
          - { niche: jardin-bricolage, market: us }
          - { niche: jardin-bricolage, market: gb }
    env:
      NICHE:  ${{ matrix.niche }}
      MARKET: ${{ matrix.market }}
      SITE:   ${{ matrix.niche }}-${{ matrix.market }}
      MANUAL_SITE: ${{ github.event.inputs.site }}
      # Cron string of the schedule that triggered this run (empty for manual).
      # Resolved to a numeric slot in the "Resolve slot" step below.
      TRIGGER_CRON: ${{ github.event.schedule }}
      FORCE_SLOT: ${{ github.event.inputs.force_slot }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      # When the workflow is dispatched manually with a specific siteId, skip
      # rows that don't match. Scheduled runs leave MANUAL_SITE empty and run
      # every row.
      - name: Filter by manual input
        run: |
          if [ -n "$MANUAL_SITE" ] && [ "$MANUAL_SITE" != "all" ] && [ "$MANUAL_SITE" != "$SITE" ]; then
            echo "Skipping $SITE (manual run targets $MANUAL_SITE)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      # Map the cron string that triggered the run to a 0..3 slot index. For
      # manual workflow_dispatch, fall back to FORCE_SLOT input (default 0).
      - if: env.SKIP != '1'
        name: Resolve slot from cron schedule
        run: |
          case "$TRIGGER_CRON" in
            '11 6 * * *')  SLOT=0 ;;
            '37 10 * * *') SLOT=1 ;;
            '23 14 * * *') SLOT=2 ;;
            '47 18 * * *') SLOT=3 ;;
            *)             SLOT="${FORCE_SLOT:-0}" ;;
          esac
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - if: env.SKIP != '1'
        uses: pnpm/action-setup@v4

      - if: env.SKIP != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: env.SKIP != '1'
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cadence gate: anti-Google-detection ramp + per-day slot election.
      # Runs after dep install (needs the workspace config) but before the
      # heavy Claude generation step — rejected slots short-circuit early.
      - if: env.SKIP != '1'
        name: Cadence gate
        env:
          BYPASS_CADENCE: ${{ github.event.inputs.bypass_cadence }}
        run: |
          DECISION=$(node packages/scripts/cadence-cli.js \
            --niche "$NICHE" --market "$MARKET" \
            --workflow daily-articles --slot "$SLOT" --num-slots 4)
          if [ "$DECISION" = "skip" ]; then
            if [ "$BYPASS_CADENCE" = "true" ]; then
              echo "Cadence says skip but bypass_cadence=true — proceeding anyway"
            else
              echo "Cadence gate: skip for $SITE (slot=$SLOT)"
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi

      - if: env.SKIP != '1'
        name: Install Playwright Chromium (for scraper browser fallback)
        run: pnpm --filter ./packages/scripts exec playwright install --with-deps chromium

      - if: env.SKIP != '1'
        name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - if: env.SKIP != '1'
        name: Refill keyword queue if empty (DataForSEO)
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          QUEUE_LEN=$(node -e "const q=require('./data/keywords-queue.json'); console.log((q[process.env.NICHE]?.[process.env.MARKET]||[]).filter(k=>k.status==='pending').length)")
          echo "pending keywords for $SITE: $QUEUE_LEN"
          if [ "$QUEUE_LEN" = "0" ]; then
            node packages/scripts/dataforseo-keywords.js --niche "$NICHE" --market "$MARKET"
          fi

      - if: env.SKIP != '1'
        name: Generate articles
        env:
          CLAUDE_CODE_OAUTH_TOKEN:    ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # DataForSEO is needed for the Google Shopping fallback when Amazon misses on a product.
          DATAFORSEO_LOGIN:           ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
          # Free image sources for hero image fetch (lib/hero-image.js).
          PEXELS_API_KEY:             ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:            ${{ secrets.PIXABAY_API_KEY }}
          AMAZON_AFFILIATE_ID_FR:     ${{ secrets.AMAZON_AFFILIATE_ID_FR }}
          AMAZON_AFFILIATE_ID_US:     ${{ secrets.AMAZON_AFFILIATE_ID_US }}
          AMAZON_AFFILIATE_ID_GB:     ${{ secrets.AMAZON_AFFILIATE_ID_GB }}
          AWIN_PUBLISHER_ID:          ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_LEROY_MERLIN_ID:       ${{ secrets.AWIN_LEROY_MERLIN_ID }}
          AWIN_BOULANGER_ID:          ${{ secrets.AWIN_BOULANGER_ID }}
          AWIN_DECATHLON_ID:          ${{ secrets.AWIN_DECATHLON_ID }}
          AWIN_DARTY_ID:              ${{ secrets.AWIN_DARTY_ID }}
          AWIN_FNAC_ID:               ${{ secrets.AWIN_FNAC_ID }}
          AWIN_CASTORAMA_ID:          ${{ secrets.AWIN_CASTORAMA_ID }}
          AWIN_MR_BRICOLAGE_ID:       ${{ secrets.AWIN_MR_BRICOLAGE_ID }}
          MAX_ARTICLES_PER_RUN:       '2'
        run: node packages/scripts/article-generator.js --niche "$NICHE" --market "$MARKET"

      - if: env.SKIP != '1'
        name: Build site
        run: pnpm --filter "./sites/$NICHE/$MARKET" build

      - if: env.SKIP != '1'
        name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/${{ matrix.niche }}/${{ matrix.market }}/dist --project-name=${{ matrix.niche }}-${{ matrix.market }} --branch=main

      - if: env.SKIP != '1'
        name: Commit data/ updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ "sites/$NICHE/$MARKET/src/content/articles/"
          # Hero + product images are written by the generator under public/images/;
          # stage them too. The "|| true" tolerates missing dirs (e.g. guides have no products/).
          git add "sites/$NICHE/$MARKET/public/images/" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "content: daily $SITE articles + queue update"
          # cloudflare/wrangler-action@v3 dirties package.json + pnpm-lock.yaml by
          # auto-installing wrangler. Drop those reverts so safe-push's rebase
          # can run (it refuses on unstaged changes).
          git checkout -- package.json pnpm-lock.yaml 2>/dev/null || true

      - if: env.SKIP != '1'
        name: Safe push (rebase + retry)
        uses: ./.github/actions/safe-push
