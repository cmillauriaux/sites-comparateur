name: Daily Content Generation

# Unified content pipeline. Replaces daily-articles + daily-guides +
# weekly-informational with a single bundle-aware runner.
#
# Per active day, the article-generator picks the next slot of a topical
# bundle (comparatif → pillar guide → avis) from data/semrush-priorities.json.
# When the priorities registry is empty for a (niche, market), this workflow
# refills it via semrush-prioritize.js (--longtail for fresh sites).
# The cross-workflow 1/day rule still applies (publishedToday > 0 → skip).
#
# Cadence: 1 → 2 → 3 articles per week as the site matures (sandbox →
# warming → ramping → mature). The 4 cron slots vary the hour-of-day
# across the week so timing reads organic.

on:
  schedule:
    - cron: '11 6 * * *'    # slot 0 — ~06:11 UTC (morning)
    - cron: '37 10 * * *'   # slot 1 — ~10:37 UTC (late morning)
    - cron: '23 14 * * *'   # slot 2 — ~14:23 UTC (afternoon)
    - cron: '47 18 * * *'   # slot 3 — ~18:47 UTC (evening)
  workflow_dispatch:
    inputs:
      site:
        description: 'siteId (<niche>-<market>) to run, or "all"'
        required: false
        default: all
      force_slot:
        description: 'Force a specific slot for testing (0-3, leave empty for auto)'
        required: false
        default: ''
      bypass_cadence:
        description: 'Bypass cadence gate (manual test runs only — ignores activeToday + slot election + publishedToday)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { niche: jardin-bricolage, market: fr }
          - { niche: jardin-bricolage, market: us }
          - { niche: jardin-bricolage, market: gb }
          - { niche: cuisine,          market: fr }
    env:
      NICHE:  ${{ matrix.niche }}
      MARKET: ${{ matrix.market }}
      SITE:   ${{ matrix.niche }}-${{ matrix.market }}
      MANUAL_SITE: ${{ github.event.inputs.site }}
      TRIGGER_CRON: ${{ github.event.schedule }}
      FORCE_SLOT: ${{ github.event.inputs.force_slot }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Filter by manual input
        run: |
          if [ -n "$MANUAL_SITE" ] && [ "$MANUAL_SITE" != "all" ] && [ "$MANUAL_SITE" != "$SITE" ]; then
            echo "Skipping $SITE (manual run targets $MANUAL_SITE)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != '1'
        name: Resolve slot from cron schedule
        run: |
          case "$TRIGGER_CRON" in
            '11 6 * * *')  SLOT=0 ;;
            '37 10 * * *') SLOT=1 ;;
            '23 14 * * *') SLOT=2 ;;
            '47 18 * * *') SLOT=3 ;;
            *)             SLOT="${FORCE_SLOT:-0}" ;;
          esac
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"

      - if: env.SKIP != '1'
        uses: pnpm/action-setup@v4

      - if: env.SKIP != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: env.SKIP != '1'
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - if: env.SKIP != '1'
        name: Cadence gate
        env:
          BYPASS_CADENCE: ${{ github.event.inputs.bypass_cadence }}
        run: |
          DECISION=$(node packages/scripts/cadence-cli.js \
            --niche "$NICHE" --market "$MARKET" \
            --workflow daily-content --slot "$SLOT" --num-slots 4)
          if [ "$DECISION" = "skip" ]; then
            if [ "$BYPASS_CADENCE" = "true" ]; then
              echo "Cadence says skip but bypass_cadence=true — proceeding anyway"
            else
              echo "Cadence gate: skip for $SITE (slot=$SLOT)"
              echo "SKIP=1" >> "$GITHUB_ENV"
            fi
          fi

      - if: env.SKIP != '1'
        name: Install Playwright Chromium (for scraper browser fallback)
        run: pnpm --filter ./packages/scripts exec playwright install --with-deps chromium

      - if: env.SKIP != '1'
        name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - if: env.SKIP != '1'
        name: Refill Semrush priorities if empty
        env:
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
        run: |
          PENDING=$(node -e "const fs=require('fs');const p='./data/semrush-priorities.json';if(!fs.existsSync(p)){console.log(0);process.exit()}const r=JSON.parse(fs.readFileSync(p,'utf8'));const b=r[process.env.NICHE]?.[process.env.MARKET]||[];console.log(b.filter(o=>o.status!=='generated'&&o.status!=='rejected'&&(o.errorCount||0)<3).length)")
          echo "pending opportunities for $SITE: $PENDING"
          if [ "$PENDING" = "0" ]; then
            node packages/scripts/semrush-prioritize.js --niche "$NICHE" --market "$MARKET" --longtail
          fi

      - if: env.SKIP != '1'
        name: Generate next bundle slot
        env:
          CLAUDE_CODE_OAUTH_TOKEN:    ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DATAFORSEO_LOGIN:           ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:        ${{ secrets.DATAFORSEO_PASSWORD }}
          PEXELS_API_KEY:             ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:            ${{ secrets.PIXABAY_API_KEY }}
          AMAZON_AFFILIATE_ID_FR:     ${{ secrets.AMAZON_AFFILIATE_ID_FR }}
          AMAZON_AFFILIATE_ID_US:     ${{ secrets.AMAZON_AFFILIATE_ID_US }}
          AMAZON_AFFILIATE_ID_GB:     ${{ secrets.AMAZON_AFFILIATE_ID_GB }}
          AWIN_PUBLISHER_ID:          ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_LEROY_MERLIN_ID:       ${{ secrets.AWIN_LEROY_MERLIN_ID }}
          AWIN_BOULANGER_ID:          ${{ secrets.AWIN_BOULANGER_ID }}
          AWIN_DECATHLON_ID:          ${{ secrets.AWIN_DECATHLON_ID }}
          AWIN_DARTY_ID:              ${{ secrets.AWIN_DARTY_ID }}
          AWIN_FNAC_ID:               ${{ secrets.AWIN_FNAC_ID }}
          AWIN_CASTORAMA_ID:          ${{ secrets.AWIN_CASTORAMA_ID }}
          AWIN_MR_BRICOLAGE_ID:       ${{ secrets.AWIN_MR_BRICOLAGE_ID }}
          MAX_ARTICLES_PER_RUN:       '1'
          BYPASS_CADENCE:             ${{ github.event.inputs.bypass_cadence }}
        run: node packages/scripts/article-generator.js --niche "$NICHE" --market "$MARKET" --bundle

      - if: env.SKIP != '1'
        name: Editorial review of generated articles
        run: |
          node packages/scripts/review-articles.js \
            --niche "$NICHE" --market "$MARKET" \
            --new --fix
        # --new   : only articles new in the working tree (git status)
        # --fix   : delete KO articles + revert their state before commit
        # exits 1 on any KO → skips Build + Deploy for this run

      - if: env.SKIP != '1'
        name: Build site
        run: pnpm --filter "./sites/$NICHE/$MARKET" build

      - if: env.SKIP != '1'
        name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/${{ matrix.niche }}/${{ matrix.market }}/dist --project-name=${{ matrix.niche }}-${{ matrix.market }} --branch=main

      - if: env.SKIP != '1'
        name: Commit data/ updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ "sites/$NICHE/$MARKET/src/content/articles/"
          git add "sites/$NICHE/$MARKET/public/images/" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "content: daily-content $SITE bundle slot"
          git checkout -- package.json pnpm-lock.yaml 2>/dev/null || true

      - if: env.SKIP != '1'
        name: Safe push (rebase + retry)
        uses: ./.github/actions/safe-push
