name: GSC Indexation Requests

on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC, after daily build
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # required to mint the OIDC token consumed by WIF

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workload Identity Federation — no service-account key exists (the GCP
      # org enforces constraints/iam.disableServiceAccountKeyCreation). This
      # exchanges the job's OIDC token for short-lived credentials and writes
      # them as Application Default Credentials, which GoogleAuth picks up.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: jardinguide-gsc
          workload_identity_provider: projects/297376749169/locations/global/workloadIdentityPools/github/providers/github
          service_account: gsc-indexing@jardinguide-gsc.iam.gserviceaccount.com

      - name: Submit pending URLs to GSC
        run: node packages/scripts/gsc-indexing.js

      - name: Commit indexation tracking
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/published-urls.json data/indexation-requests.json
          git diff --staged --quiet || git commit -m "chore: GSC indexation tracking"

      - name: Safe push (rebase + retry)
        uses: ./.github/actions/safe-push
