name: Weekly Content Refresh

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { niche: jardin-bricolage, market: fr }
          - { niche: jardin-bricolage, market: us }
          - { niche: jardin-bricolage, market: gb }
    env:
      NICHE:  ${{ matrix.niche }}
      MARKET: ${{ matrix.market }}
      SITE:   ${{ matrix.niche }}-${{ matrix.market }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (for scraper browser fallback)
        run: pnpm --filter ./packages/scripts exec playwright install --with-deps chromium

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Refresh oldest articles
        env:
          CLAUDE_CODE_OAUTH_TOKEN:    ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AMAZON_AFFILIATE_ID_FR:     ${{ secrets.AMAZON_AFFILIATE_ID_FR }}
          AMAZON_AFFILIATE_ID_US:     ${{ secrets.AMAZON_AFFILIATE_ID_US }}
          AMAZON_AFFILIATE_ID_GB:     ${{ secrets.AMAZON_AFFILIATE_ID_GB }}
          AWIN_PUBLISHER_ID:          ${{ secrets.AWIN_PUBLISHER_ID }}
          MAX_REFRESH_PER_RUN:        '3'
          MIN_AGE_DAYS:               '60'
        run: node packages/scripts/content-updater.js --niche "$NICHE" --market "$MARKET"

      - name: Rebuild + flag deploy if articles changed
        run: |
          if ! git diff --quiet HEAD -- "sites/$NICHE/$MARKET/src/content/"; then
            pnpm --filter "./sites/$NICHE/$MARKET" build
            echo "DEPLOY=1" >> "$GITHUB_ENV"
          fi

      - name: Deploy if changed
        if: env.DEPLOY == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sites/${{ matrix.niche }}/${{ matrix.market }}/dist --project-name=${{ matrix.niche }}-${{ matrix.market }} --branch=main

      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ "sites/$NICHE/$MARKET/src/content/articles/"
          # Hero + product images are written by the generator under public/images/;
          # stage them too. The "|| true" tolerates missing dirs (e.g. guides have no products/).
          git add "sites/$NICHE/$MARKET/public/images/" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "content: weekly refresh $SITE"
          # cloudflare/wrangler-action@v3 dirties package.json + pnpm-lock.yaml by
          # auto-installing wrangler. Drop those reverts so safe-push's rebase
          # can run (it refuses on unstaged changes).
          git checkout -- package.json pnpm-lock.yaml 2>/dev/null || true

      - name: Safe push (rebase + retry)
        uses: ./.github/actions/safe-push
